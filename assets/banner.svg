<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="320" r="140" fill="#818cf8" opacity="0.07" filter="url(#glow)"/>

  <!-- Code Frame / Simulated Terminal -->
  <g transform="translate(820, 70)">
    <rect width="330" height="260" rx="12" fill="#030712" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="35" cy="18" r="4.5" fill="#eab308"/>
    <circle cx="50" cy="18" r="4.5" fill="#22c55e"/>
    <line x1="0" y1="32" x2="330" y2="32" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="60" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">POST /api/v1/checkout</text>
    <text x="16" y="85" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">Host: mock.service.local</text>
    <text x="16" y="105" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">x-mock-scenario: payment-success</text>

    <line x1="16" y1="120" x2="314" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="16" y="145" font-family="Consolas, monospace" font-size="12" fill="#22c55e">HTTP/1.1 200 OK</text>
    <text x="16" y="170" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">{</text>
    <text x="30" y="190" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">  &quot;status&quot;: &quot;approved&quot;,</text>
    <text x="30" y="210" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">  &quot;simulated_latency&quot;: &quot;12ms&quot;</text>
    <text x="16" y="230" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">}</text>

    <!-- Pulsing radar status -->
    <circle cx="300" cy="18" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Left Branding -->
  <g transform="translate(60, 0)">
    <rect x="0" y="65" width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <text x="90" y="84" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">✨ CURATED DIRECTORY</text>

    <text x="0" y="145" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="800" font-size="42" fill="url(#titleGrad)" letter-spacing="-0.5">Awesome API Mocking</text>
    <text x="0" y="195" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="-0.5">&amp; Virtualization Platforms 🎭</text>
    <text x="0" y="240" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="16" fill="#94a3b8">Top Mock Servers • Contract-Driven OpenAPI • Service Virtualization • Chaos Simulation</text>

    <!-- Dynamic animated wave bar -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="680" height="4" rx="2" fill="#1e293b"/>
      <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#pulseGrad)">
        <animate attributeName="x" values="0;480;0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Capability Tags -->
    <g transform="translate(0, 305)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="55" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">REST &amp; HTTP</text>
      <rect x="120" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="167" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">OpenAPI 3.x</text>
      <rect x="225" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="267" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">gRPC/SOAP</text>
      <rect x="320" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="380" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Chaos &amp; Faults</text>
      <rect x="450" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="500" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Record &amp; Play</text>
      <rect x="560" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="617" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Open Source</text>
    </g>
  </g>
</svg>